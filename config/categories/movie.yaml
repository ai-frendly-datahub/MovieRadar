  # === 글로벌 영화 뉴스 ===
  - name: "Variety Film"
    type: "rss"
    url: "https://variety.com/feed/"

  - name: "Hollywood Reporter"
    type: "rss"
    url: "https://www.hollywoodreporter.com/feed/"

  - name: "Deadline"
    type: "rss"
    url: "https://deadline.com/feed/"

  - name: "Screen Rant"
    type: "rss"
    url: "https://screenrant.com/feed/"

  - name: "Collider"
    type: "rss"
    url: "https://collider.com/feed/"

  - name: "IndieWire"
    type: "rss"
    url: "https://www.indiewire.com/feed/"

  # NOTE: 2026-04-02 테스트에서 동작하지 않음 (404)
  # - name: "Film School Rejects"
  #   type: "rss"
  #   url: "https://filmschoolrejects.com/feed/"

  # === OTT/스트리밍 ===
  - name: "What's on Netflix"
    type: "rss"
    url: "https://www.whats-on-netflix.com/feed/"

  - name: "Decider"
    type: "rss"
    url: "https://decider.com/feed/"

  # === 박스오피스 데이터 ===
  - name: "KOFIC 박스오피스"
    type: "javascript"
    url: "https://www.kobis.or.kr/kobis/business/stat/boxs/findDailyBoxOfficeList.do"
    config:
      wait_for: ".board_box"
      content_selector: "tr"

  - name: "Box Office Mojo"
    type: "javascript"
    url: "https://www.boxofficemojo.com/"
    config:
      wait_for: "table"

  # === MCP 서버 소스 (한국 문화 데이터) ===
  - name: "관광 문화행사 MCP"
    type: "mcp"
    url: "https://github.com/harimkang/mcp-korea-tourism-api"
    config:
      transport: stdio
      command: uvx
      args: ["--from", "git+https://github.com/harimkang/mcp-korea-tourism-api", "mcp-korea-tourism-api"]
      env:
        TOUR_API_KEY: "${TOUR_API_KEY}"
      tool: get_festival_events
      arguments:
        area_code: "1"
        event_start_date: "20260401"
      transform:
        title_field: title
        link_field: detail_url
        summary_fields: ["addr1", "event_start_date", "event_end_date"]
        published_field: event_start_date

  # NOTE: be-node-seoul-data-mcp는 npm에 없음 - git URL 사용
  - name: "서울 문화행사 MCP"
    type: "mcp"
    url: "https://github.com/pinnaclesoft-ko/be-node-seoul-data-mcp"
    config:
      transport: stdio
      command: npx
      args: ["-y", "git+https://github.com/pinnaclesoft-ko/be-node-seoul-data-mcp"]
      env:
        SEOUL_API_KEY: "${SEOUL_API_KEY}"
      tool: get_cultural_events
      arguments:
        codename: ""
        date: "2026-04"
      transform:
        title_field: title
        link_field: org_link
        summary_fields: ["place", "date", "use_fee"]
        published_field: strt_date

