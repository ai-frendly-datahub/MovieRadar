category_name: movie
display_name: 영화 레이더
data_quality:
  priority: P2
  primary_motion: intelligence
  weakest_dimension: authority
  quality_outputs:
    freshness_report: reports/movie_quality.json
    dated_freshness_report_pattern: reports/movie_YYYYMMDD_quality.json
    tracked_event_models:
    - reservation_ranking
    - box_office
    - ott_ranking
    - release_calendar
  event_models:
    reservation_ranking:
      date_fields:
      - ranking_date
      - collected_at
      required_fields:
      - movie_id
      - rank
      - market
      - source_url
    box_office:
      date_fields:
      - gross_date
      - collected_at
      required_fields:
      - movie_id
      - rank
      - gross
      - market
    ott_ranking:
      date_fields:
      - ranking_date
      - collected_at
      required_fields:
      - movie_id
      - platform
      - rank
      - region
    release_calendar:
      date_fields:
      - release_date
      - collected_at
      required_fields:
      - title
      - release_year
      - country
      - source_url
  canonical_keys:
    movie:
    - normalized_title
    - release_year
    - country
    - director
    market_ranking:
    - movie_id
    - market
    - ranking_date
    - source
  freshness_sla:
    reservation_ranking_days: 1
    box_office_days: 1
    ott_ranking_days: 7
    release_calendar_days: 14
  quality_gates:
  - 작품명, 개봉연도, 국가를 canonical movie key로 유지한다
  - 극장 흥행과 OTT 순위를 별도 레이어로 분리한다
  - 예매일, 개봉일, 수집일을 별도 필드로 유지한다
  - 관객 평점과 박스오피스 추이는 분리 출력한다
source_backlog:
  operational_candidates:
  - id: kofic_daily_boxoffice_api
    name: KOFIC daily box office API
    signal_type: box_office
    activation_gate: API key, movie code mapping, and gross date retention
  - id: korean_ticket_reservation_ranking
    name: Korean ticket reservation ranking pages
    signal_type: reservation_ranking
    activation_gate: ToS review, ranking parser stability, and market/date tagging
  - id: netflix_top10_dataset
    name: Netflix Top 10 dataset
    signal_type: ott_ranking
    activation_gate: title/year canonicalization, region mapping, and weekly window
      handling
  - id: distributor_release_calendars
    name: Distributor release calendars
    signal_type: release_calendar
    activation_gate: distributor taxonomy, duplicate title handling, and source evidence
      retention
