- name: 관광 문화행사 MCP
  type: mcp
  url: https://github.com/harimkang/mcp-korea-tourism-api
  language: ko
  country: KR
  trust_tier: T1_official
  content_type: news
  config:
    transport: stdio
    command: uvx
    args:
    - --from
    - git+https://github.com/harimkang/mcp-korea-tourism-api
    - mcp-korea-tourism-api
    env:
      TOUR_API_KEY: ${TOUR_API_KEY}
    tool: get_festival_events
    arguments:
      area_code: '1'
      event_start_date: '20260401'
    transform:
      title_field: title
      link_field: detail_url
      summary_fields:
      - addr1
      - event_start_date
      - event_end_date
      published_field: event_start_date
    event_model: editorial_coverage
- name: 서울 문화행사 MCP
  type: mcp
  url: https://github.com/pinnaclesoft-ko/be-node-seoul-data-mcp
  language: ko
  country: KR
  trust_tier: T1_official
  content_type: news
  config:
    transport: stdio
    command: npx
    args:
    - -y
    - git+https://github.com/pinnaclesoft-ko/be-node-seoul-data-mcp
    env:
      SEOUL_API_KEY: ${SEOUL_API_KEY}
    tool: get_cultural_events
    arguments:
      codename: ''
      date: 2026-04
    transform:
      title_field: title
      link_field: org_link
      summary_fields:
      - place
      - date
      - use_fee
      published_field: strt_date
    event_model: editorial_coverage
